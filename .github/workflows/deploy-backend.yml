name: Deploy API Back-end (NestJS)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: portfolio-495417
  REGION: us-central1
  REPO_NAME: portfolio-images
  SERVICE_NAME: portfolio-api

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ⬇️ Checkout do Código
        uses: actions/checkout@v4

      - name: 🔐 Autenticar no GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: 🐳 Configurar Docker no Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: 'oauth2accesstoken'
          password: ${{ steps.auth.outputs.access_token }}

      - name: 📦 Build e Push da Imagem
        run: |-
          # Usando o ID do projeto que está no log de erro (portfolio-495417)
          IMAGE_PATH="us-central1-docker.pkg.dev/portfolio-495417/portfolio-images/backend:${{ github.sha }}"
          
          # 1. Mostrar as variáveis para debug
          echo "Construindo imagem: $IMAGE_PATH"
          
          # 2. Build forçado (sem cache) para garantir que o NestJS seja compilado
          docker build --no-cache -f backend/Dockerfile -t $IMAGE_PATH .
          
          # 3. Push explícito. Se falhar aqui, o script para.
          echo "Iniciando Push para o Artifact Registry..."
          docker push $IMAGE_PATH

      - name: 🚀 Deploy no Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/backend:${{ github.sha }}
          flags: >
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --service-account=portfolio-api-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com